<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  :root{
    --bar:#14161c; --bar2:#1c1f27; --line:#2b2f3a; --ink:#e8e9ec; --mut:#9aa0ab;
    --chip:#2a2e39; --on:#3b82f6; --danger:#e05a5a;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; font-family:Inter,system-ui,Arial,sans-serif; color:var(--ink);
    -webkit-user-select:none; user-select:none; }
  #app{ background:var(--bar); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  #bar{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; padding:8px 10px; background:var(--bar);
    border-bottom:1px solid var(--line); }
  .grp{ display:flex; align-items:center; gap:4px; }
  .sep{ width:1px; height:26px; background:var(--line); margin:0 4px; }
  .tbtn{ min-width:34px; height:34px; padding:0 8px; display:grid; place-items:center; gap:6px;
    grid-auto-flow:column; background:var(--bar2); border:1px solid var(--line); border-radius:8px;
    color:var(--ink); cursor:pointer; font-size:12.5px; font-weight:600; }
  .tbtn:hover{ background:var(--chip); }
  .tbtn.on{ background:var(--on); border-color:var(--on); color:#fff; }
  .tbtn.ghost{ background:transparent; }
  .tbtn svg{ width:18px; height:18px; }
  .tbtn.danger:hover{ background:var(--danger); border-color:var(--danger); color:#fff; }
  .sw{ width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,.25); cursor:pointer; }
  .sw.on{ border-color:#fff; box-shadow:0 0 0 2px var(--on); }
  #size{ width:96px; accent-color:var(--on); }
  .lbl{ font-size:11px; color:var(--mut); font-weight:600; }
  #wrap{ position:relative; background:#0b0d10; display:grid; place-items:center; padding:10px; }
  #cv{ max-width:100%; height:auto; border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,.35);
    cursor:crosshair; touch-action:none; display:block; }
  #cv.selm{ cursor:default; }
  #empty{ color:var(--mut); font-size:14px; padding:60px 20px; text-align:center; }
  #txtin{ position:absolute; display:none; z-index:5; font-weight:800; border:1px dashed var(--on);
    background:rgba(0,0,0,.5); color:#fff; padding:2px 6px; border-radius:4px; outline:none; }
  #hint{ color:var(--mut); font-size:11.5px; padding:0 10px 8px; }
</style>
</head>
<body>
<div id="app">
  <div id="bar"></div>
  <div id="wrap"><canvas id="cv" width="16" height="9"></canvas><input id="txtin" spellcheck="false"/></div>
  <div id="hint"></div>
</div>
<script>
(function(){
  // ---- Streamlit static-component bridge (same protocol as the tactical canvas) ----
  function send(t,x){ window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:t}, x||{}), "*"); }
  function ready(){ send("streamlit:componentReady",{apiVersion:1}); }
  function setHeight(){ send("streamlit:setFrameHeight",{height: document.body.scrollHeight+2}); }
  var lastTs=0; function nextTs(){ var t=Date.now(); if(t<=lastTs) t=lastTs+1; lastTs=t; return t; }
  function toPython(p){ p.ts=nextTs(); send("streamlit:setComponentValue",{dataType:"json", value:p}); }

  // ---- state ----
  var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
  var bar=document.getElementById("bar"), wrap=document.getElementById("wrap");
  var txtin=document.getElementById("txtin"), hintEl=document.getElementById("hint");
  var img=null, imgReady=false, lastImageSig=null, lastLoadNonce=null, editable=true;
  var anns=[], redo=[], sel=-1;
  var tool="arrow", color="#ffffff", size=10;
  var drawing=null, moving=null;           // in-progress draw / move state
  // ---- perspective ("3D-look" ground plane) ----
  var persp=null;                          // 4 image points [[x,y]*4] = corners of a ground rectangle (TL,TR,BR,BL)
  var perspOn=false;                       // draw spotlights/circles projected onto the ground plane
  var calibrating=false, calDrag=-1;       // 4-point calibration state
  var Hgi=null, Hig=null;                  // homographies: ground->image, image->ground

  // ---- homography (4-point) : solve, build, apply ----
  function solve8(A,b){                     // Gaussian elimination for an 8x8 system
    var n=8,i,j,k;
    for(i=0;i<n;i++){
      var p=i; for(k=i+1;k<n;k++) if(Math.abs(A[k][i])>Math.abs(A[p][i])) p=k;
      var t=A[i]; A[i]=A[p]; A[p]=t; var tb=b[i]; b[i]=b[p]; b[p]=tb;
      if(Math.abs(A[i][i])<1e-12) return null;
      for(k=i+1;k<n;k++){ var f=A[k][i]/A[i][i]; for(j=i;j<n;j++) A[k][j]-=f*A[i][j]; b[k]-=f*b[i]; }
    }
    var x=new Array(n);
    for(i=n-1;i>=0;i--){ var s=b[i]; for(j=i+1;j<n;j++) s-=A[i][j]*x[j]; x[i]=s/A[i][i]; }
    return x;
  }
  function homography(src,dst){            // 3x3 (h33=1) mapping src[i]->dst[i], 4 correspondences
    var A=[],b=[],i;
    for(i=0;i<4;i++){ var x=src[i][0],y=src[i][1],u=dst[i][0],v=dst[i][1];
      A.push([x,y,1,0,0,0,-u*x,-u*y]); b.push(u);
      A.push([0,0,0,x,y,1,-v*x,-v*y]); b.push(v); }
    var h=solve8(A,b); if(!h) return null;
    return [[h[0],h[1],h[2]],[h[3],h[4],h[5]],[h[6],h[7],1]];
  }
  function applyH(H,x,y){ if(!H) return {x:x,y:y};
    var d=H[2][0]*x+H[2][1]*y+H[2][2];
    return { x:(H[0][0]*x+H[0][1]*y+H[0][2])/d, y:(H[1][0]*x+H[1][1]*y+H[1][2])/d }; }
  var GSQ=[[0,0],[1,0],[1,1],[0,1]];       // ground unit square (TL,TR,BR,BL)
  function rebuildH(){ Hgi=null; Hig=null;
    if(persp && persp.length===4){ Hgi=homography(GSQ,persp); Hig=homography(persp,GSQ); } }
  function defaultPersp(){                  // a strong pitch-camera trapezoid (narrow far edge, wide near
    var w=cv.width, h=cv.height;            // edge running off both sides) so ground shapes read as 3D at once
    return [[w*0.36,h*0.32],[w*0.64,h*0.32],[w*1.06,h*1.00],[w*-0.06,h*1.00]];
  }

  var TOOLS=[
    ["select","Select","M4 3l16 7-6 2-2 6z"],
    ["arrow","Arrow","M4 20L20 4 M12 4h8v8"],
    ["curvedarrow","Curved arrow","M4 19 C 5 9 12 6 19 7 M19 7l-4-2 M19 7l-1 4"],
    ["darrow","Dashed arrow","M4 20L20 4 M12 4h8v8"],
    ["line","Line","M4 20L20 4"],
    ["spotlight","Spotlight","M12 3v3 M12 18v3 M3 12h3 M18 12h3 M12 8a4 4 0 100 8 4 4 0 000-8z"],
    ["ellipse","Circle","M12 5c5 0 9 3 9 7s-4 7-9 7-9-3-9-7 4-7 9-7z"],
    ["rect","Box","M4 6h16v12H4z"],
    ["pen","Pen","M4 20l3-1 11-11-2-2L5 17z M15 6l2 2"],
    ["text","Text","M5 5h14 M12 5v14 M9 19h6"]
  ];
  var COLORS=["#ffffff","#ffd23f","#e23b3b","#2f7bd6","#22b573","#111318"];

  function icon(d){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+
    (d.indexOf("z")>-1 && d.indexOf(" ")===-1 ? '<path d="'+d+'" fill="currentColor" stroke="none"/>' : '<path d="'+d+'"/>')+'</svg>'; }

  function buildBar(){
    var h='';
    h+='<div class="grp" id="tools"></div><div class="sep"></div>';
    h+='<div class="grp" id="colors"></div><div class="sep"></div>';
    h+='<div class="grp"><span class="lbl">Size</span><input type="range" id="size" min="2" max="30" value="'+size+'"></div>';
    h+='<div class="sep"></div>';
    h+='<div class="grp">'+
       '<button class="tbtn ghost'+(perspOn?" on":"")+'" id="persp" title="Perspective — draw spotlights flat on the pitch (3D look)">'+icon("M3 20l4-14h10l4 14z")+'<span>3D</span></button>'+
       '<button class="tbtn ghost" id="calib" title="Set the 4 pitch corners for perspective" style="'+(perspOn?"":"display:none")+'">'+icon("M4 4h4 M16 4h4 M4 20h4 M16 20h4 M4 4v4 M20 4v4 M4 16v4 M20 16v4")+'</button>'+
       '</div><div class="sep"></div>';
    h+='<div class="grp">'+
       '<button class="tbtn ghost" id="undo" title="Undo (Ctrl+Z)">'+icon("M9 7L4 12l5 5 M4 12h11a5 5 0 010 10h-1")+'</button>'+
       '<button class="tbtn ghost" id="redo" title="Redo (Ctrl+Y)">'+icon("M15 7l5 5-5 5 M20 12H9a5 5 0 000 10h1")+'</button>'+
       '<button class="tbtn ghost danger" id="clear" title="Clear all">'+icon("M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13")+'</button>'+
       '</div><div class="sep"></div>';
    h+='<button class="tbtn" id="export" title="Download PNG">'+icon("M12 3v12 M8 11l4 4 4-4 M4 21h16")+'<span>Download PNG</span></button>';
    bar.innerHTML=h;
    var tw=document.getElementById("tools");
    TOOLS.forEach(function(t){
      var b=document.createElement("button"); b.className="tbtn ghost"+(t[0]===tool?" on":"");
      b.dataset.tool=t[0]; b.title=t[1]; b.innerHTML=icon(t[2]);
      b.onclick=function(){ setTool(t[0]); };
      tw.appendChild(b);
    });
    var cw=document.getElementById("colors");
    COLORS.forEach(function(c){
      var s=document.createElement("div"); s.className="sw"+(c===color?" on":""); s.style.background=c;
      s.dataset.c=c; s.onclick=function(){ setColor(c); }; cw.appendChild(s);
    });
    document.getElementById("size").oninput=function(){ size=+this.value; if(sel>-1 && anns[sel]){ anns[sel].w=size; render(); syncSoon(); } };
    document.getElementById("undo").onclick=undo;
    document.getElementById("redo").onclick=doRedo;
    document.getElementById("clear").onclick=function(){ if(anns.length){ pushRedoSnapshot(); anns=[]; sel=-1; render(); sync(); } };
    document.getElementById("export").onclick=exportPng;
    var pb=document.getElementById("persp"); if(pb) pb.onclick=togglePersp;
    var cb=document.getElementById("calib"); if(cb) cb.onclick=function(){
      calibrating=!calibrating; if(calibrating && !persp){ persp=defaultPersp(); rebuildH(); }
      render(); updateHint(); };
    updateHint();
  }
  function setTool(t){ tool=t; sel=-1; cv.classList.toggle("selm", t==="select");
    document.querySelectorAll("#tools .tbtn").forEach(function(b){ b.classList.toggle("on", b.dataset.tool===t); });
    render(); updateHint(); }
  function setColor(c){ color=c;
    document.querySelectorAll("#colors .sw").forEach(function(s){ s.classList.toggle("on", s.dataset.c===c); });
    if(sel>-1 && anns[sel]){ anns[sel].c=c; render(); syncSoon(); } }
  function togglePersp(){
    perspOn=!perspOn;
    // enabling 3D is frictionless: a sensible default ground plane is ready immediately, so the
    // Spotlight / Circle / Box tools draw in perspective right away. Refining the 4 corners (the
    // "corners" button) is optional, for matching a specific pitch.
    if(perspOn){ if(!persp) persp=defaultPersp(); rebuildH(); }
    else calibrating=false;
    buildBar(); render(); updateHint();
  }
  function updateHint(){
    if(calibrating){ hintEl.textContent="Perspective: drag the 4 yellow markers onto the pitch corners of a rectangle (e.g. a penalty box), then click the corners button again."; return; }
    if(perspOn && (tool==="spotlight"||tool==="ellipse"||tool==="rect")){ hintEl.textContent="3D on: drag to draw a "+(tool==="spotlight"?"spotlight":tool==="rect"?"box":"circle")+" flat on the pitch. Tap the corners button to match your pitch lines."; return; }
    if(!perspOn && (tool==="spotlight"||tool==="ellipse"||tool==="rect")){ hintEl.textContent="Drawing FLAT. Turn on 3D (top toolbar) to place this on the pitch in perspective."; return; }
    var m={select:"Click a mark to select · drag to move · Delete to remove · (curved arrow: drag the blue dot to bend)",
      arrow:"Drag on the image to draw a press arrow",
      curvedarrow:"Drag start→end, then switch to Select and drag the blue dot to bend it left/right/up",
      darrow:"Drag to draw a dashed arrow (runs / off-ball movement)",
      line:"Drag to draw a connecting line",
      spotlight:"Drag to place a glowing player spotlight",
      ellipse:"Drag to draw a circle / highlight",
      rect:"Drag to draw a box / zone",
      pen:"Draw freehand — press and drag",
      text:"Click where you want the caption, then type"};
    hintEl.textContent = editable ? (m[tool]||"") : "Read-only";
  }

  // ---- coordinate mapping (screen -> natural image pixels) ----
  function pt(e){
    var r=cv.getBoundingClientRect();
    var sx=cv.width/r.width, sy=cv.height/r.height;
    return { x:(e.clientX-r.left)*sx, y:(e.clientY-r.top)*sy };
  }

  // ---- broadcast drawing system -------------------------------------------------
  // Annotations are stored in "design" units (a 1050px-wide analysis frame).  This keeps
  // a saved drawing visually identical on a 720p clip, a 4K still, and the exported PNG.
  var DESIGN_W=1050;
  function scale(){ return Math.max(.45, cv.width/DESIGN_W); }
  function weight(a){ return Math.max(1.2, Math.min(7.5, (a.w||10)*.43))*scale(); }
  function keyWeight(w){ return w+Math.max(2*scale(),w*.52); }
  function keyline(){ return "rgba(5,8,12,.82)"; }
  function prepareStroke(a, dashed){
    var w=weight(a); ctx.lineCap="round"; ctx.lineJoin="round";
    // The slim charcoal keyline, rather than a big drop shadow, is what lets a white
    // analysis line stay readable over shirts, grass, and stadium signage.
    ctx.strokeStyle=keyline(); ctx.lineWidth=keyWeight(w); if(dashed) ctx.setLineDash(dashed);
    return w;
  }
  function finishStroke(a,w,dashed){
    ctx.strokeStyle=a.c||"#fff"; ctx.lineWidth=w; if(dashed) ctx.setLineDash(dashed); ctx.stroke();
    ctx.setLineDash([]);
  }
  function arrowHead(tipx, tipy, ux, uy, w, col){
    // A compact swept pennant reads cleanly at broadcast scale; the shaft stops at its shoulder.
    var head=Math.max(12*scale(),w*3.25), bx=tipx-ux*head, by=tipy-uy*head;
    var px=-uy, py=ux, hw=head*.46, shoulder=head*.18;
    ctx.save(); ctx.lineJoin="round";
    ctx.beginPath(); ctx.moveTo(tipx,tipy); ctx.lineTo(bx+px*hw,by+py*hw);
    ctx.lineTo(bx+ux*shoulder,by+uy*shoulder); ctx.lineTo(bx-px*hw,by-py*hw); ctx.closePath();
    ctx.fillStyle=keyline(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(tipx,tipy); ctx.lineTo(bx+px*hw*.76,by+py*hw*.76);
    ctx.lineTo(bx+ux*shoulder,by+uy*shoulder); ctx.lineTo(bx-px*hw*.76,by-py*hw*.76); ctx.closePath();
    ctx.fillStyle=col; ctx.fill(); ctx.restore();
    return {bx:bx+ux*shoulder, by:by+uy*shoulder};
  }
  function drawArrow(a){
    var dx=a.x2-a.x1, dy=a.y2-a.y1, len=Math.hypot(dx,dy); if(len<1) return;
    var ux=dx/len, uy=dy/len, w=weight(a), h;
    ctx.save(); h=arrowHead(a.x2,a.y2,ux,uy,w,a.c||"#fff");
    ctx.beginPath(); ctx.moveTo(a.x1,a.y1); ctx.lineTo(h.bx,h.by); prepareStroke(a); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(a.x1,a.y1); ctx.lineTo(h.bx,h.by); finishStroke(a,w); ctx.restore();
  }
  function curveCtrl(a){ return { x:(a.cx!=null?a.cx:(a.x1+a.x2)/2), y:(a.cy!=null?a.cy:(a.y1+a.y2)/2) }; }
  function drawCurvedArrow(a){
    var c=curveCtrl(a), w=weight(a);
    var dx=a.x2-c.x, dy=a.y2-c.y, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;   // tangent at the end
    ctx.save(); var h=arrowHead(a.x2,a.y2,ux,uy,w,a.c||"#fff");
    ctx.beginPath(); ctx.moveTo(a.x1,a.y1); ctx.quadraticCurveTo(c.x,c.y,h.bx,h.by); prepareStroke(a); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(a.x1,a.y1); ctx.quadraticCurveTo(c.x,c.y,h.bx,h.by); finishStroke(a,w); ctx.restore();
  }
  function drawDashedArrow(a){
    var dx=a.x2-a.x1, dy=a.y2-a.y1, len=Math.hypot(dx,dy); if(len<1) return;
    var ux=dx/len, uy=dy/len, w=weight(a), h, dash=[w*2.25,w*1.55];
    ctx.save(); h=arrowHead(a.x2,a.y2,ux,uy,w,a.c||"#fff");
    ctx.beginPath(); ctx.moveTo(a.x1,a.y1); ctx.lineTo(h.bx,h.by); prepareStroke(a,dash); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(a.x1,a.y1); ctx.lineTo(h.bx,h.by); finishStroke(a,w,dash); ctx.restore();
  }
  function drawLine(a){ ctx.save(); var w=weight(a);
    ctx.beginPath(); ctx.moveTo(a.x1,a.y1); ctx.lineTo(a.x2,a.y2); prepareStroke(a); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(a.x1,a.y1); ctx.lineTo(a.x2,a.y2); finishStroke(a,w); ctx.restore(); }
  function drawSpot(a){
    var cx=(a.x1+a.x2)/2, cy=(a.y1+a.y2)/2;
    var rx=Math.max(14*scale(),Math.abs(a.x2-a.x1)/2), ry=Math.max(9*scale(),Math.abs(a.y2-a.y1)/2);
    ctx.save(); var w=weight(a);
    // A translucent elliptical field gives the highlight a camera-overlay glow without
    // obscuring the player.  Rings are deliberately sparse and geometrically exact.
    ctx.fillStyle=hexA(a.c||"#fff",.10); ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=hexA(a.c||"#fff",.18); ctx.lineWidth=w*2.8; ctx.beginPath(); ctx.ellipse(cx,cy,rx*1.10,ry*1.10,0,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle=keyline(); ctx.lineWidth=keyWeight(w); ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle=a.c||"#fff"; ctx.lineWidth=w; ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  function drawEllipse(a){ var cx=(a.x1+a.x2)/2, cy=(a.y1+a.y2)/2;
    ctx.save(); var w=weight(a),rx=Math.abs(a.x2-a.x1)/2,ry=Math.abs(a.y2-a.y1)/2;
    ctx.strokeStyle=keyline(); ctx.lineWidth=keyWeight(w); ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle=a.c||"#fff"; ctx.lineWidth=w; ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
  function drawRect(a){ var x=Math.min(a.x1,a.x2),y=Math.min(a.y1,a.y2),rw=Math.abs(a.x2-a.x1),rh=Math.abs(a.y2-a.y1),w=weight(a);
    // Corner brackets identify a tactical zone more elegantly than a generic office-software box.
    var k=Math.min(Math.max(12*scale(),Math.min(rw,rh)*.23),38*scale());
    function brackets(){ ctx.beginPath(); ctx.moveTo(x+k,y);ctx.lineTo(x,y);ctx.lineTo(x,y+k);ctx.moveTo(x+rw-k,y);ctx.lineTo(x+rw,y);ctx.lineTo(x+rw,y+k);ctx.moveTo(x+rw,y+rh-k);ctx.lineTo(x+rw,y+rh);ctx.lineTo(x+rw-k,y+rh);ctx.moveTo(x+k,y+rh);ctx.lineTo(x,y+rh);ctx.lineTo(x,y+rh-k); }
    ctx.save(); brackets(); prepareStroke(a);ctx.stroke(); brackets();finishStroke(a,w);ctx.restore(); }
  function traceSmooth(pts){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
    for(var i=1;i<pts.length-1;i++){ var mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;ctx.quadraticCurveTo(pts[i][0],pts[i][1],mx,my); }
    var z=pts[pts.length-1];ctx.lineTo(z[0],z[1]); }
  function drawPen(a){ if(!a.pts||a.pts.length<2) return; ctx.save();var w=weight(a);traceSmooth(a.pts);prepareStroke(a);ctx.stroke();traceSmooth(a.pts);finishStroke(a,w);ctx.restore(); }
  function drawText(a){ var fs=(a.size||34)*scale(), txt=(a.text||"").toUpperCase(); ctx.save();
    ctx.font="700 "+fs+"px Inter,Arial,sans-serif"; ctx.textBaseline="middle"; ctx.lineJoin="round";
    ctx.shadowColor="rgba(0,0,0,.72)";ctx.shadowBlur=Math.max(2,fs*.09);ctx.shadowOffsetY=Math.max(1,fs*.045);
    ctx.lineWidth=Math.max(2*scale(),fs*.105);ctx.strokeStyle="#05080c";ctx.strokeText(txt,a.x1,a.y1);
    ctx.shadowColor="transparent";ctx.fillStyle=a.c||"#fff";ctx.fillText(txt,a.x1,a.y1);ctx.restore(); }

  // ---- perspective ground marks (a circle on the pitch -> a perspective ellipse) ----
  function ringPoly(gx,gy,gr,mult){ var N=48,poly=[],k; for(k=0;k<N;k++){ var th=k/N*6.28318530718;
    poly.push(applyH(Hgi, gx+gr*mult*Math.cos(th), gy+gr*mult*Math.sin(th))); } return poly; }
  function pathPoly(poly){ ctx.beginPath(); ctx.moveTo(poly[0].x,poly[0].y);
    for(var i=1;i<poly.length;i++) ctx.lineTo(poly[i].x,poly[i].y); ctx.closePath(); }
  function groundQuad(a){ return [applyH(Hgi,a.gx1,a.gy1),applyH(Hgi,a.gx2,a.gy1),
                                  applyH(Hgi,a.gx2,a.gy2),applyH(Hgi,a.gx1,a.gy2)]; }
  function groundEllipsePoly(a){ var cx=(a.gx1+a.gx2)/2, cy=(a.gy1+a.gy2)/2,
    rx=Math.abs(a.gx2-a.gx1)/2, ry=Math.abs(a.gy2-a.gy1)/2, N=48, poly=[], k;
    for(k=0;k<N;k++){ var th=k/N*6.28318530718; poly.push(applyH(Hgi, cx+rx*Math.cos(th), cy+ry*Math.sin(th))); }
    return poly; }
  function drawGround(a){
    if(!Hgi) return;
    ctx.save();
    if(a.type==="spotlight"){
      var ctr=applyH(Hgi,a.gx,a.gy), main=ringPoly(a.gx,a.gy,a.gr,1), i, rA=0;
      for(i=0;i<main.length;i++){ var d=Math.hypot(main[i].x-ctr.x, main[i].y-ctr.y); if(d>rA) rA=d; }
      var w=weight(a);
      ctx.fillStyle=hexA(a.c||"#fff",.10); pathPoly(main); ctx.fill();
      ctx.strokeStyle=hexA(a.c||"#fff",.18);ctx.lineWidth=w*2.8;pathPoly(ringPoly(a.gx,a.gy,a.gr,1.12));ctx.stroke();
      ctx.strokeStyle=keyline();ctx.lineWidth=keyWeight(w);pathPoly(main);ctx.stroke();
      ctx.strokeStyle=a.c||"#fff";ctx.lineWidth=w;pathPoly(main);ctx.stroke();
    } else {                                             // ground box / circle in perspective
      var sw=weight(a), poly=a.type==="rect" ? groundQuad(a) : groundEllipsePoly(a);
      ctx.lineJoin="round";ctx.lineCap="round";ctx.strokeStyle=keyline();ctx.lineWidth=keyWeight(sw);pathPoly(poly);ctx.stroke();
      ctx.strokeStyle=a.c||"#fff";ctx.lineWidth=sw;pathPoly(poly);ctx.stroke();
    }
    ctx.restore();
  }
  function drawPerspGuide(){
    if(!persp) return;
    ctx.save(); ctx.setLineDash([9,6]); ctx.lineWidth=2; ctx.strokeStyle="rgba(255,210,63,.9)";
    ctx.beginPath(); ctx.moveTo(persp[0][0],persp[0][1]);
    for(var i=1;i<4;i++) ctx.lineTo(persp[i][0],persp[i][1]); ctx.closePath(); ctx.stroke();
    ctx.setLineDash([]);
    var r=Math.max(9, cv.width/140);
    for(var j=0;j<4;j++){ ctx.fillStyle="#ffd23f"; ctx.strokeStyle="#111"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(persp[j][0],persp[j][1],r,0,6.2832); ctx.fill(); ctx.stroke(); }
    ctx.restore();
  }

  function drawOne(a, active){
    if(a.g){ drawGround(a); return; }
    if(a.type==="arrow") drawArrow(a);
    else if(a.type==="curvedarrow") drawCurvedArrow(a);
    else if(a.type==="darrow") drawDashedArrow(a);
    else if(a.type==="line") drawLine(a);
    else if(a.type==="spotlight") drawSpot(a);
    else if(a.type==="ellipse") drawEllipse(a);
    else if(a.type==="rect") drawRect(a);
    else if(a.type==="pen") drawPen(a);
    else if(a.type==="text") drawText(a);
  }

  function render(){
    if(!imgReady){ return; }
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0,cv.width,cv.height);
    for(var i=0;i<anns.length;i++) drawOne(anns[i], i===sel);
    if(drawing) drawOne(drawing, false);
    if(calibrating) drawPerspGuide();
    if(sel>-1 && anns[sel]){ drawSelBox(anns[sel]);
      if(anns[sel].type==="curvedarrow"){ var cc=curveCtrl(anns[sel]);
        ctx.save(); ctx.fillStyle="#3b82f6"; ctx.strokeStyle="#fff"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(cc.x,cc.y,Math.max(6,cv.width/150),0,6.2832); ctx.fill(); ctx.stroke(); ctx.restore(); } }
    setHeight();
  }
  function bbox(a){
    if(a.g){ if(!Hgi) return {x:0,y:0,w:0,h:0};
      var poly = (a.gr!=null) ? ringPoly(a.gx,a.gy,a.gr,1.1) : groundQuad(a);
      var xs=poly.map(function(q){return q.x;}), ys=poly.map(function(q){return q.y;});
      var gx0=Math.min.apply(0,xs), gy0=Math.min.apply(0,ys);
      return {x:gx0,y:gy0,w:Math.max.apply(0,xs)-gx0,h:Math.max.apply(0,ys)-gy0}; }
    if(a.type==="curvedarrow"){ var c=curveCtrl(a), xs=[a.x1,a.x2,c.x], ys=[a.y1,a.y2,c.y];
      var x0=Math.min.apply(0,xs), y0=Math.min.apply(0,ys);
      return {x:x0,y:y0,w:Math.max.apply(0,xs)-x0,h:Math.max.apply(0,ys)-y0}; }
    if(a.type==="text"){ var fs=(a.size||34)*scale(); var w=ctx.measureText?( (ctx.font="700 "+fs+"px Inter,Arial"), ctx.measureText((a.text||"").toUpperCase()).width):120;
      return {x:a.x1-6,y:a.y1-fs*0.7,w:w+12,h:fs*1.4}; }
    if(a.type==="pen"){ var xs=a.pts.map(function(p){return p[0];}), ys=a.pts.map(function(p){return p[1];});
      var x0=Math.min.apply(0,xs),y0=Math.min.apply(0,ys); return {x:x0,y:y0,w:Math.max.apply(0,xs)-x0,h:Math.max.apply(0,ys)-y0}; }
    var x=Math.min(a.x1,a.x2), y=Math.min(a.y1,a.y2); return {x:x,y:y,w:Math.abs(a.x2-a.x1),h:Math.abs(a.y2-a.y1)};
  }
  function drawSelBox(a){ var b=bbox(a); ctx.save(); ctx.strokeStyle="#3b82f6"; ctx.lineWidth=2;
    ctx.setLineDash([6,4]); ctx.strokeRect(b.x-6,b.y-6,b.w+12,b.h+12); ctx.restore(); }

  function hitTest(p){
    for(var i=anns.length-1;i>=0;i--){ var b=bbox(anns[i]);
      if(p.x>=b.x-10 && p.x<=b.x+b.w+10 && p.y>=b.y-10 && p.y<=b.y+b.h+10) return i; }
    return -1;
  }
  function hexA(hex,a){ hex=hex.replace("#",""); if(hex.length===3) hex=hex.replace(/(.)/g,"$1$1");
    var r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16);
    return "rgba("+r+","+g+","+b+","+a+")"; }

  // ---- history ----
  function snapshot(){ return JSON.stringify(anns); }
  function restore(s){ anns=JSON.parse(s); sel=-1; }
  var undoStack=[];
  function pushRedoSnapshot(){ undoStack.push(snapshot()); redo=[]; if(undoStack.length>60) undoStack.shift(); }
  function undo(){ if(!undoStack.length) return; redo.push(snapshot()); restore(undoStack.pop()); render(); sync(); }
  function doRedo(){ if(!redo.length) return; undoStack.push(snapshot()); restore(redo.pop()); render(); sync(); }

  // ---- pointer interaction ----
  cv.addEventListener("pointerdown", function(e){
    if(!editable || !imgReady) return; cv.setPointerCapture(e.pointerId); var p=pt(e);
    if(calibrating && persp){                          // drag a perspective corner marker
      calDrag=-1; var best=1e9;
      for(var i=0;i<4;i++){ var dx=persp[i][0]-p.x, dy=persp[i][1]-p.y, d=dx*dx+dy*dy;
        if(d<best){ best=d; calDrag=i; } }
      return;
    }
    if(tool==="select"){
      if(sel>-1 && anns[sel] && anns[sel].type==="curvedarrow"){     // grab the bend handle first
        var ca=anns[sel], cc=curveCtrl(ca), hr=Math.max(14, cv.width/90);
        if(Math.hypot(p.x-cc.x, p.y-cc.y) < hr){ pushRedoSnapshot();
          moving={i:sel, ctrl:true, ox:p.x, oy:p.y, snap:JSON.parse(JSON.stringify(ca))}; return; }
      }
      var hit=hitTest(p); sel=hit;
      if(hit>-1){ pushRedoSnapshot(); moving={i:hit, ox:p.x, oy:p.y, snap:JSON.parse(JSON.stringify(anns[hit]))}; }
      render(); return;
    }
    if(tool==="text"){ startText(e,p); return; }
    pushRedoSnapshot();
    if(perspOn && Hig && (tool==="spotlight"||tool==="ellipse"||tool==="rect")){   // ground-plane (3D) mark
      var g0=applyH(Hig,p.x,p.y);
      if(tool==="spotlight") drawing={type:"spotlight", g:true, c:color, w:size, gx:g0.x, gy:g0.y, gr:0};
      else drawing={type:tool, g:true, c:color, w:size, gx1:g0.x, gy1:g0.y, gx2:g0.x, gy2:g0.y};
    }
    else if(tool==="pen"){ drawing={type:"pen", c:color, w:size, pts:[[p.x,p.y]]}; }
    else { drawing={type:tool, c:color, w:size, x1:p.x, y1:p.y, x2:p.x, y2:p.y}; }
    render();
  });
  cv.addEventListener("pointermove", function(e){
    if(!editable) return; var p=pt(e);
    if(calDrag>-1 && persp){ persp[calDrag]=[p.x,p.y]; rebuildH(); render(); return; }
    if(moving){ var a=anns[moving.i], dx=p.x-moving.ox, dy=p.y-moving.oy;
      moveAnn(a, moving.snap, dx, dy, moving.ctrl); render(); return; }
    if(!drawing) return;
    if(drawing.g){ var g1=applyH(Hig,p.x,p.y);
      if(drawing.type==="spotlight") drawing.gr=Math.hypot(g1.x-drawing.gx, g1.y-drawing.gy);
      else { drawing.gx2=g1.x; drawing.gy2=g1.y; }
      render(); return; }
    if(drawing.type==="pen") drawing.pts.push([p.x,p.y]);
    else { drawing.x2=p.x; drawing.y2=p.y; }
    render();
  });
  cv.addEventListener("pointerup", function(e){
    if(calDrag>-1){ calDrag=-1; sync(); return; }       // perspective corner moved → persist
    if(moving){ moving=null; sync(); return; }
    if(!drawing) return;
    var d=drawing; drawing=null;
    var big = d.g ? (d.gr>0.012 || Math.hypot((d.gx2-d.gx1)||0,(d.gy2-d.gy1)||0)>0.02)
                  : (d.type==="pen" ? d.pts.length>2 : (Math.hypot((d.x2-d.x1),(d.y2-d.y1))>6));
    if(d.type==="curvedarrow" && d.cx==null){                 // default a visible perpendicular bend
      var mx=(d.x1+d.x2)/2, my=(d.y1+d.y2)/2, ex=d.x2-d.x1, ey=d.y2-d.y1, L=Math.hypot(ex,ey)||1;
      d.cx=mx + (-ey/L)*L*0.22; d.cy=my + (ex/L)*L*0.22;
    }
    if(big){ anns.push(d); sel=-1; render(); sync(); }
    else { if(undoStack.length) undoStack.pop(); render(); }   // discard a stray click
  });
  function moveAnn(a, snap, dx, dy, ctrl){
    if(ctrl && a.type==="curvedarrow"){ a.cx=snap.cx+dx; a.cy=snap.cy+dy; return; }
    if(a.g){                                          // shift ground marks by an image-space delta
      if(a.gr!=null){ var c0=applyH(Hgi,snap.gx,snap.gy), ng=applyH(Hig,c0.x+dx,c0.y+dy); a.gx=ng.x; a.gy=ng.y; }
      else { var p1=applyH(Hgi,snap.gx1,snap.gy1), p2=applyH(Hgi,snap.gx2,snap.gy2),
             q1=applyH(Hig,p1.x+dx,p1.y+dy), q2=applyH(Hig,p2.x+dx,p2.y+dy);
             a.gx1=q1.x; a.gy1=q1.y; a.gx2=q2.x; a.gy2=q2.y; }
      return;
    }
    if(a.type==="pen"){ a.pts=snap.pts.map(function(q){ return [q[0]+dx,q[1]+dy]; }); }
    else if(a.type==="text"){ a.x1=snap.x1+dx; a.y1=snap.y1+dy; }
    else { a.x1=snap.x1+dx; a.y1=snap.y1+dy; a.x2=snap.x2+dx; a.y2=snap.y2+dy;
           if(a.type==="curvedarrow" && snap.cx!=null){ a.cx=snap.cx+dx; a.cy=snap.cy+dy; } }
  }

  // ---- text tool ----
  function startText(e,p){
    var r=cv.getBoundingClientRect();
    txtin.style.display="block";
    txtin.style.left=(e.clientX - wrap.getBoundingClientRect().left)+"px";
    txtin.style.top=(e.clientY - wrap.getBoundingClientRect().top - 12)+"px";
    txtin.style.color=color; txtin.value=""; txtin.dataset.x=p.x; txtin.dataset.y=p.y;
    setTimeout(function(){ txtin.focus(); }, 10);
  }
  function commitText(){
    var v=(txtin.value||"").trim(); txtin.style.display="none";
    if(!v) return;
    pushRedoSnapshot();
    // Store type at the same design scale as line weights; drawText resolves it at render time.
    anns.push({type:"text", c:color, text:v, x1:+txtin.dataset.x, y1:+txtin.dataset.y, size:34});
    render(); sync();
  }
  txtin.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); commitText(); }
    else if(e.key==="Escape"){ txtin.style.display="none"; } });
  txtin.addEventListener("blur", commitText);

  // ---- keyboard ----
  window.addEventListener("keydown", function(e){
    if(document.activeElement===txtin) return;
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); }
    else if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==="y")){ e.preventDefault(); doRedo(); }
    else if((e.key==="Delete"||e.key==="Backspace") && sel>-1){ e.preventDefault(); pushRedoSnapshot(); anns.splice(sel,1); sel=-1; render(); sync(); }
    else if(e.key==="Escape"){ sel=-1; render(); }
  });

  // ---- sync to Python (debounced) ----
  var syncT=null;
  function sync(){ toPython({kind:"sync", anns:anns, persp:persp}); }
  function syncSoon(){ clearTimeout(syncT); syncT=setTimeout(sync, 400); }

  // ---- export ----
  function exportPng(){
    if(!imgReady) return;
    sel=-1; drawing=null; calibrating=false; render();  // clean frame (no selection box / guide)
    var url = cv.toDataURL("image/png");
    toPython({kind:"export", png:url, anns:anns, persp:persp});
  }

  // ---- image load ----
  function loadImage(src){
    imgReady=false; var im=new Image();
    im.onload=function(){ img=im; cv.width=im.naturalWidth||im.width; cv.height=im.naturalHeight||im.height;
      imgReady=true; render(); };
    im.onerror=function(){ imgReady=false; };
    im.src=src;
  }

  // ---- Streamlit render ----
  window.addEventListener("message", function(ev){
    var d=ev.data||{}; if(d.type!=="streamlit:render") return;
    var a=d.args||{};
    editable = a.editable!==false;
    if(a.image && a.image!==lastImageSig){ lastImageSig=a.image; loadImage(a.image); }
    if(!a.image){ lastImageSig=null; imgReady=false; ctx.clearRect(0,0,cv.width,cv.height); }
    // adopt server annotations only when the load nonce changes (initial mount / opening a saved one)
    if(a.load_nonce!==undefined && a.load_nonce!==lastLoadNonce){
      lastLoadNonce=a.load_nonce; anns=Array.isArray(a.anns)?a.anns.slice():[]; sel=-1; undoStack=[]; redo=[];
      persp=(Array.isArray(a.persp)&&a.persp.length===4)?a.persp.map(function(p){return [+p[0],+p[1]];}):null;
      rebuildH();
      if(imgReady) render();
    }
    if(!bar.children.length) buildBar();
    updateHint(); setHeight();
  });
  window.addEventListener("resize", setHeight);
  buildBar(); ready(); setHeight();
})();
</script>
</body>
