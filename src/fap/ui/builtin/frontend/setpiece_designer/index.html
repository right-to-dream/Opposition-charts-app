<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  :root{ --bg:#0e1218; --bar:#141922; --bar2:#1b2130; --line:#2a3242; --ink:#e9edf3; --mut:#8e99ab;
         --chip:#252d3d; --on:#2f81f7; --on2:#1f6feb; --warn:#e5484d; --gold:#ffd23f; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; font-family:"Segoe UI",Inter,system-ui,Arial,sans-serif; color:var(--ink);
             background:transparent; -webkit-user-select:none; user-select:none; }
  #app{ background:var(--bg); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  /* top bar */
  #top{ display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--bar); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #name{ flex:1 1 220px; min-width:160px; background:transparent; border:1px solid transparent; color:var(--ink);
         font-size:15px; font-weight:700; padding:5px 8px; border-radius:8px; outline:none; }
  #name:hover{ border-color:var(--line); } #name:focus{ border-color:var(--on); background:var(--bar2); }
  .seg{ display:flex; background:var(--bar2); border:1px solid var(--line); border-radius:9px; padding:2px; }
  .seg button{ background:transparent; border:0; color:var(--mut); font-weight:600; font-size:12px; padding:6px 10px;
               border-radius:7px; cursor:pointer; }
  .seg button.on{ background:var(--chip); color:var(--ink); box-shadow:0 1px 0 rgba(255,255,255,.04) inset; }
  .ib{ height:32px; min-width:32px; display:inline-grid; place-items:center; background:var(--bar2); border:1px solid var(--line);
       border-radius:9px; color:var(--ink); cursor:pointer; padding:0 8px; font-size:12px; font-weight:600; gap:6px; grid-auto-flow:column; }
  .ib:hover{ background:var(--chip); } .ib.on{ background:var(--on2); border-color:var(--on2); color:#fff; }
  .ib:disabled{ opacity:.4; cursor:default; }
  .ib svg{ width:16px; height:16px; }
  .sw{ width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,.35); padding:0; cursor:pointer; overflow:hidden; }
  .sw input{ opacity:0; width:100%; height:100%; cursor:pointer; }
  .lbl{ font-size:10.5px; color:var(--mut); font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
  /* body */
  #body{ display:grid; grid-template-columns:96px 1fr 230px; min-height:300px; }
  #rail{ background:var(--bar); border-right:1px solid var(--line); padding:8px 6px; display:grid; grid-template-columns:40px 40px; gap:4px; align-content:start; justify-content:center; }
  .tool{ width:40px; height:40px; border-radius:10px; border:1px solid transparent; background:transparent; color:var(--ink);
         cursor:pointer; display:grid; place-items:center; position:relative; padding:0; }
  .tool:hover{ background:var(--bar2); border-color:var(--line); }
  .tool.on{ background:var(--on2); border-color:var(--on2); }
  .tool svg{ width:22px; height:22px; }
  .tool .k{ position:absolute; right:3px; bottom:1px; font-size:8.5px; color:var(--mut); font-weight:700; }
  .tool.on .k{ color:#cfe1ff; }
  .rsep{ grid-column:1 / span 2; height:1px; background:var(--line); margin:4px 2px; }
  #stage{ position:relative; display:grid; place-items:start center; padding:10px; background:#0a0d12; }
  #cv{ display:block; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.45); touch-action:none; cursor:crosshair; }
  #cv.sel{ cursor:default; } #cv.grab{ cursor:grabbing; }
  #txtin{ position:absolute; display:none; z-index:5; background:rgba(10,14,20,.9); color:#fff; border:1px solid var(--on);
          border-radius:6px; padding:4px 8px; font-weight:700; font-size:13px; outline:none; min-width:160px; }
  #toast{ position:absolute; left:50%; top:16px; transform:translateX(-50%); background:rgba(20,25,34,.92); border:1px solid var(--line);
          padding:6px 12px; border-radius:20px; font-size:12px; color:var(--ink); opacity:0; transition:opacity .25s; pointer-events:none; }
  /* inspector */
  #insp{ background:var(--bar); border-left:1px solid var(--line); padding:12px; display:flex; flex-direction:column; gap:10px; overflow:auto; }
  #insp h4{ margin:0; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); }
  .row{ display:flex; gap:6px; align-items:center; }
  .fld{ display:flex; flex-direction:column; gap:4px; }
  .fld input[type=text], .fld textarea, .fld select{ background:var(--bar2); border:1px solid var(--line); color:var(--ink); border-radius:8px;
      padding:6px 8px; font-size:12.5px; outline:none; font-family:inherit; width:100%; }
  .fld textarea{ resize:vertical; min-height:64px; }
  .fld input:focus, .fld textarea:focus, .fld select:focus{ border-color:var(--on); }
  .pal{ display:flex; gap:5px; flex-wrap:wrap; }
  .pal button{ width:20px; height:20px; border-radius:50%; border:2px solid rgba(255,255,255,.2); cursor:pointer; padding:0; }
  .pal button.on{ border-color:#fff; box-shadow:0 0 0 2px var(--on); }
  .tip{ font-size:12px; color:var(--mut); line-height:1.5; }
  .tip b{ color:var(--ink); }
  .kbd{ display:inline-block; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; font-size:10.5px; color:var(--ink); margin-right:3px; }
  /* timeline */
  #tl{ background:var(--bar); border-top:1px solid var(--line); padding:10px 12px; display:grid; grid-template-columns:auto 1fr; gap:10px 12px; }
  #transport{ display:flex; gap:6px; align-items:center; }
  #play{ width:40px; height:40px; border-radius:50%; background:var(--on2); border:0; color:#fff; cursor:pointer; display:grid; place-items:center; }
  #play svg{ width:18px; height:18px; }
  #steps{ display:flex; gap:6px; align-items:center; overflow-x:auto; padding-bottom:2px; }
  .step{ flex:0 0 auto; display:flex; align-items:center; gap:7px; background:var(--bar2); border:1px solid var(--line); border-radius:10px;
         padding:6px 10px; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--mut); }
  .step .n{ width:20px; height:20px; border-radius:50%; background:var(--chip); display:grid; place-items:center; font-size:11px; color:var(--ink); }
  .step.on{ border-color:var(--on); color:var(--ink); background:#17233a; }
  .step.on .n{ background:var(--on2); color:#fff; }
  .step.play{ border-color:var(--gold); }
  #stepedit{ grid-column:1 / span 2; display:grid; grid-template-columns:200px 1fr 170px; gap:10px; align-items:start; }
  #stepedit .fld textarea{ min-height:38px; height:38px; }
  #prog{ height:3px; background:var(--line); border-radius:2px; overflow:hidden; grid-column:1 / span 2; }
  #prog i{ display:block; height:100%; width:0; background:var(--gold); }
  .ro #rail, .ro #insp .edit, .ro .needs-edit{ display:none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <input id="name" spellcheck="false" maxlength="120"/>
    <span class="lbl">View</span>
    <div class="seg" id="view"><button data-v="third">Final third</button><button data-v="half">Half</button><button data-v="full">Full</button></div>
    <span class="lbl">Pitch</span>
    <div class="seg" id="style"><button data-v="grass">Grass</button><button data-v="dark">Dark</button><button data-v="light">Light</button></div>
    <span class="lbl needs-edit">Teams</span>
    <label class="sw needs-edit" id="swh" title="Our colour"><input type="color" id="colh"/></label>
    <label class="sw needs-edit" id="swa" title="Opponent colour"><input type="color" id="cola"/></label>
    <button class="ib needs-edit" id="mirror" title="Mirror left ↔ right (e.g. corner from the other side)">⇋ Mirror</button>
    <button class="ib" id="ghost" title="Show the previous step faintly">Ghost</button>
    <button class="ib needs-edit" id="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="ib needs-edit" id="redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
  </div>
  <div id="body">
    <div id="rail"></div>
    <div id="stage"><canvas id="cv"></canvas><input id="txtin" spellcheck="false" maxlength="120"/><div id="toast"></div></div>
    <div id="insp"></div>
  </div>
  <div id="tl">
    <div id="transport">
      <button id="play" title="Play (Space)"></button>
      <select id="speed" class="ib" title="Speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
      <button class="ib" id="loop" title="Loop">Loop</button>
    </div>
    <div id="steps"></div>
    <div id="prog"><i></i></div>
    <div id="stepedit">
      <div class="fld"><span class="lbl">Step name</span><input type="text" id="sname" maxlength="60"/></div>
      <div class="fld"><span class="lbl">Coaching note for this step</span><textarea id="snote" maxlength="400" placeholder="What happens in this step — who moves, when, why"></textarea></div>
      <div class="fld"><span class="lbl">Move time <span id="durv"></span></span><input type="range" id="sdur" min="0.4" max="4" step="0.1"/></div>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
// ---------------------------------------------------------------- Streamlit bridge
function send(t,x){ window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:t},x||{}),"*"); }
var lastTs=0; function nts(){ var t=Date.now(); if(t<=lastTs) t=lastTs+1; lastTs=t; return t; }
function toPython(p){ p.ts=nts(); send("streamlit:setComponentValue",{dataType:"json",value:p}); }
function setHeight(){ send("streamlit:setFrameHeight",{height:document.getElementById("app").offsetHeight+4}); }

// ---------------------------------------------------------------- constants (mirror render.py)
var L=105, W=68, MARGIN=3;
var VIEW_RECT={half:[L/2,L], third:[68,L], full:[0,L]};
var SCALE={half:1.0, third:0.85, full:1.45};
var STYLE={
  grass:{field:["#3b8746","#367e41"],surround:"#2f7139",line:"rgba(255,255,255,.9)",ink:"#f8fafc",run:"#ffffff",pass:"#ffd23f",shot:"#ff4d4f",plain:"#ffffff",pill:"rgba(11,18,32,.75)"},
  dark:{field:["#142030","#17253a"],surround:"#0f1824",line:"#5b6f8c",ink:"#eef2f8",run:"#e8eef7",pass:"#ffd23f",shot:"#ff5d73",plain:"#cbd5e1",pill:"rgba(11,15,23,.8)"},
  light:{field:["#f4f6f9","#eceff4"],surround:"#ffffff",line:"#9aa7b8",ink:"#0f172a",run:"#1e293b",pass:"#d97706",shot:"#dc2626",plain:"#334155",pill:"rgba(255,255,255,.85)"}
};
var OBJ_COL={cone:"#f97316",mannequin:"#facc15",pole:"#ef4444",mark:"#9aa5b4"};
var ZONE_COLS=["#ffd23f","#2f81f7","#e5484d","#16a34a","#a855f7","#ffffff"];
var LINE_COLS=["", "#ffffff","#ffd23f","#ff4d4f","#2f81f7","#16a34a","#111827"];

// ---------------------------------------------------------------- state
var doc=null, cur=0, sel=null, tool="select", editable=true, ghost=false, loop=false;
var undo=[], redo=[], lastNonce=null, dirtyT=null;
var cv=document.getElementById("cv"), ctx=cv.getContext("2d"), dpr=Math.max(1,window.devicePixelRatio||1);
var ppm=8, u0=0,v0=0,u1=1,v1=1;
var drag=null, playing=null;

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function step(){ return doc.steps[cur]; }
function vert(){ return doc.view!=="full"; }
function k(){ return SCALE[doc.view]; }
function proj(x,y){ return vert()? [W-y, L-x] : [x, W-y]; }
function unproj(u,v){ return vert()? [L-v, W-u] : [u, W-v]; }
function ext(){ var r=VIEW_RECT[doc.view]; return vert()? [-MARGIN, W+MARGIN, -MARGIN, (L-r[0])+MARGIN] : [r[0]-MARGIN, r[1]+MARGIN, -MARGIN, W+MARGIN]; }
function toPx(x,y){ var p=proj(x,y); return [(p[0]-u0)*ppm, (p[1]-v0)*ppm]; }
function toWorld(px,py){ return unproj(px/ppm+u0, py/ppm+v0); }
function round2(v){ return Math.round(v*100)/100; }
function dist(a,b){ return Math.hypot(a[0]-b[0],a[1]-b[1]); }
function bez(a,b,c,t){ if(!c) return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]; var u=1-t;
  return [u*u*a[0]+2*u*t*c[0]+t*t*b[0], u*u*a[1]+2*u*t*c[1]+t*t*b[1]]; }
function ease(t){ return t*t*(3-2*t); }
function uid(p){ return p+Math.random().toString(36).slice(2,8); }
function objById(id){ for(var i=0;i<doc.objects.length;i++) if(doc.objects[i].id===id) return doc.objects[i]; return null; }
function objColor(o){ if(o.color) return o.color; var c=doc.colors||{};
  if(o.kind==="player") return c[(o.gk?"gk_":"")+(o.team==="away"?"away":"home")]||"#1f6feb"; return OBJ_COL[o.kind]||"#fff"; }
function inkOn(h){ h=(h||"#000").replace("#",""); if(h.length===3) h=h.split("").map(function(c){return c+c;}).join("");
  var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  return (0.299*r+0.587*g+0.114*b)>165?"#111827":"#ffffff"; }

// ---------------------------------------------------------------- history & sync
function snapshot(){ undo.push(JSON.stringify(doc)); if(undo.length>80) undo.shift(); redo=[]; updButtons(); }
function changed(){ draw(); clearTimeout(dirtyT); dirtyT=setTimeout(function(){ toPython({kind:"sync",doc:doc,cur:cur,nonce:lastNonce}); },500); }
function doUndo(){ if(!undo.length) return; redo.push(JSON.stringify(doc)); doc=JSON.parse(undo.pop()); fixCur(); sel=null; full(); changed(); }
function doRedo(){ if(!redo.length) return; undo.push(JSON.stringify(doc)); doc=JSON.parse(redo.pop()); fixCur(); sel=null; full(); changed(); }
function fixCur(){ if(cur>=doc.steps.length) cur=doc.steps.length-1; if(cur<0) cur=0; }
function toast(t){ var e=document.getElementById("toast"); e.textContent=t; e.style.opacity=1; clearTimeout(toast._t); toast._t=setTimeout(function(){e.style.opacity=0;},1400); }

// ---------------------------------------------------------------- layout
function layout(){
  var e=ext(); u0=e[0]; u1=e[1]; v0=e[2]; v1=e[3];
  var stage=document.getElementById("stage");
  var availW=Math.max(280, stage.clientWidth-20);
  var maxH=vert()? 640: 600;
  var w=availW, h=w*(v1-v0)/(u1-u0);
  if(h>maxH){ h=maxH; w=h*(u1-u0)/(v1-v0); }
  ppm=w/(u1-u0);
  cv.style.width=w+"px"; cv.style.height=h+"px";
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

// ---------------------------------------------------------------- drawing
function pathLine(pts){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); }
function arc(cx,cy,r,a0,a1,n){ var o=[]; n=n||48; for(var i=0;i<=n;i++){ var a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]); } return o; }
function pitchLines(){
  var o=[[[0,0],[L,0],[L,W],[0,W],[0,0]],[[L/2,0],[L/2,W]], arc(L/2,W/2,9.15,0,360,72)];
  [[0,1],[L,-1]].forEach(function(g){ var gx=g[0], s=g[1];
    o.push([[gx,W/2-20.16],[gx+s*16.5,W/2-20.16],[gx+s*16.5,W/2+20.16],[gx,W/2+20.16]]);
    o.push([[gx,W/2-9.16],[gx+s*5.5,W/2-9.16],[gx+s*5.5,W/2+9.16],[gx,W/2+9.16]]);
    o.push([[gx,W/2-3.66],[gx-s*2,W/2-3.66],[gx-s*2,W/2+3.66],[gx,W/2+3.66]]);
    var a=Math.acos(5.5/9.15)*180/Math.PI, px=gx+s*11;
    o.push(s===1? arc(px,W/2,9.15,-a,a): arc(px,W/2,9.15,180-a,180+a));
    o.push(arc(gx,0,1,s===1?0:90,(s===1?0:90)+90,12)); o.push(arc(gx,W,1,s===1?270:180,(s===1?270:180)+90,12));
  });
  return o;
}
function drawPitch(){
  var S=STYLE[doc.style]; ctx.fillStyle=S.surround; ctx.fillRect(0,0,cv.width,cv.height);
  var n=18;
  for(var i=0;i<n;i++){ var a=toPx(L*i/n,0), b=toPx(L*(i+1)/n,W);
    ctx.fillStyle=S.field[i%2]; ctx.fillRect(Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1])); }
  ctx.strokeStyle=S.line; ctx.lineWidth=Math.max(1.2, ppm*0.16); ctx.lineJoin="round"; ctx.lineCap="round";
  pitchLines().forEach(function(p){ pathLine(p.map(function(q){return toPx(q[0],q[1]);})); ctx.stroke(); });
  ctx.fillStyle=S.line;
  [[L/2,W/2],[11,W/2],[L-11,W/2]].forEach(function(s){ var p=toPx(s[0],s[1]); ctx.beginPath(); ctx.arc(p[0],p[1],Math.max(1.5,ppm*0.3),0,7); ctx.fill(); });
}
function linePts(ln){
  var n=48, a=ln.a, b=ln.b, c=ln.c, pts=[], i;
  for(i=0;i<=n;i++) pts.push(bez(a,b,c,i/n));
  if(ln.kind==="dribble"){
    var waves=Math.max(2,Math.floor(dist(a,b)/2.2)), out=[];
    for(i=0;i<=n;i++){ var p0=pts[Math.max(0,i-1)], p1=pts[Math.min(n,i+1)], dx=p1[0]-p0[0], dy=p1[1]-p0[1], d=Math.hypot(dx,dy)||1;
      var amp=0.55*Math.sin(i/n*Math.PI*2*waves)*Math.min(1,i/4,(n-i)/4);
      out.push([pts[i][0]-dy/d*amp, pts[i][1]+dx/d*amp]); }
    pts=out;
  }
  return pts.map(function(p){ return toPx(p[0],p[1]); });
}
function lineColor(ln){ var S=STYLE[doc.style]; return ln.color || {run:S.run,pass:S.pass,shot:S.shot,dribble:S.run,line:S.plain}[ln.kind]; }
function drawLine(ln, alpha, selected){
  var px=linePts(ln), col=lineColor(ln), K=k();
  ctx.save(); ctx.globalAlpha=alpha;
  var total=0; for(var i=0;i<px.length-1;i++) total+=dist(px[i],px[i+1]);
  var head=ln.kind!=="line", hs=Math.min(1.5*K*ppm*(ln.kind==="shot"?1.15:1), total*0.4), tip=px[px.length-1], shaft=px;
  if(head){ shaft=px.filter(function(p){ return dist(p,tip)>hs*0.7; }); if(!shaft.length) shaft=[px[0]]; }
  ctx.strokeStyle=col; ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.lineWidth=({shot:0.34,pass:0.26}[ln.kind]||0.22)*K*ppm;
  ctx.setLineDash(ln.kind==="run"? [ctx.lineWidth*2.2, ctx.lineWidth*1.9]: []);
  if(selected){ ctx.save(); ctx.strokeStyle="rgba(47,129,247,.55)"; ctx.lineWidth+=6; ctx.setLineDash([]); pathLine(px); ctx.stroke(); ctx.restore(); }
  if(shaft.length>1){ pathLine(shaft); ctx.stroke(); }
  ctx.setLineDash([]);
  if(head){ var p=shaft[shaft.length-1], dx=tip[0]-p[0], dy=tip[1]-p[1], d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d;
    var bx=tip[0]-ux*hs, by=tip[1]-uy*hs; ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(tip[0],tip[1]);
    ctx.lineTo(bx-uy*hs*0.55, by+ux*hs*0.55); ctx.lineTo(bx+uy*hs*0.55, by-ux*hs*0.55); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function zoneRect(z){ var c=toPx(z.x,z.y), w=(vert()?z.h:z.w)*ppm, h=(vert()?z.w:z.h)*ppm; return [c[0]-w/2,c[1]-h/2,w,h]; }
function drawZone(z, alpha, selected){
  var r=zoneRect(z), col=z.color||"#ffd23f";
  ctx.save(); ctx.globalAlpha=alpha;
  if(z.shape==="ellipse"){ ctx.beginPath(); ctx.ellipse(r[0]+r[2]/2, r[1]+r[3]/2, Math.abs(r[2]/2), Math.abs(r[3]/2), 0, 0, 7); }
  else roundRect(r[0],r[1],r[2],r[3],Math.min(r[2],r[3])*0.12);
  ctx.fillStyle=col; ctx.globalAlpha=alpha*0.2; ctx.fill();
  ctx.globalAlpha=alpha*0.9; ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.setLineDash([6,4]); ctx.stroke(); ctx.setLineDash([]);
  if(z.label){ ctx.globalAlpha=alpha; ctx.fillStyle=col; ctx.font="800 "+Math.max(9,1.05*ppm)+"px Segoe UI,Inter,Arial"; ctx.textBaseline="top";
    ctx.fillText(z.label.toUpperCase(), r[0]+0.5*ppm, r[1]+0.5*ppm); }
  if(selected){ ctx.globalAlpha=1; ctx.strokeStyle="#2f81f7"; ctx.lineWidth=1.5; ctx.strokeRect(r[0]-3,r[1]-3,r[2]+6,r[3]+6);
    handle(r[0]+r[2], r[1]+r[3]); }
  ctx.restore();
}
function pill(text, x, y, size, ink, bg, valign){

    var att = tool==="line"? null : nearestObj(w, (tool==="pass"||tool==="shot")? ["ball","player"] : ["player","ball"]);
    if(att && (tool==="pass"||tool==="shot")){ var b=nearestObj(w,["ball"]); if(b) att=b; }
    var a= att? st.pos[att.id].slice() : [round2(w[0]),round2(w[1])];
    drag={kind:"newline", ln:{id:uid("l"),kind:tool,a:a,b:a.slice(),c:null,obj:att?att.id:null,color:""}};
    drag.preview=function(){ if(dist(drag.ln.a,drag.ln.b)>0.4) drawLine(drag.ln,0.85,false); }; return;
  }
  if(tool==="zone"||tool==="ezone"){ drag={kind:"newzone", a:w, b:w}; drag.preview=function(){
      drawZone({x:(drag.a[0]+drag.b[0])/2,y:(drag.a[1]+drag.b[1])/2,w:Math.abs(drag.b[0]-drag.a[0]),h:Math.abs(drag.b[1]-drag.a[1]),shape:tool==="ezone"?"ellipse":"rect",color:"#ffd23f",label:""},0.8,false); }; return; }
  if(tool==="text"){ askText(p, w); return; }
});
cv.addEventListener("pointermove", function(e){
  if(!drag) { if(tool==="select" && doc && !playing){ var p0=evPx(e); cv.style.cursor = hit(p0[0],p0[1])? "grab":"default"; } return; }
  var p=evPx(e), w=toWorld(p[0],p[1]), st=step();
  if(drag.kind==="obj"){ moveObj(drag.id,[w[0]+drag.off[0], w[1]+drag.off[1]]); drag.moved=true; }
  else if(drag.kind==="text"||drag.kind==="zone"){ drag.o.x=round2(w[0]+drag.off[0]); drag.o.y=round2(w[1]+drag.off[1]); drag.moved=true; }
  else if(drag.kind==="line"){ var dx=w[0]-drag.start[0], dy=w[1]-drag.start[1], ln=drag.o;
    if(!ln.obj) ln.a=[round2(drag.a0[0]+dx),round2(drag.a0[1]+dy)]; ln.b=[round2(drag.b0[0]+dx),round2(drag.b0[1]+dy)];
    if(drag.c0) ln.c=[round2(drag.c0[0]+dx),round2(drag.c0[1]+dy)]; drag.moved=true; }
  else if(drag.kind==="lineh"){ var l2=findLine(drag.id); if(drag.h==="b") l2.b=[round2(w[0]),round2(w[1])]; else if(drag.h==="a") l2.a=[round2(w[0]),round2(w[1])];
    else { // control point so that the curve passes through the pointer at t=.5
      l2.c=[round2(2*w[0]-(l2.a[0]+l2.b[0])/2), round2(2*w[1]-(l2.a[1]+l2.b[1])/2)]; } }
  else if(drag.kind==="zoneh"){ var z=st.zones.filter(function(x){return x.id===drag.id;})[0], c=toPx(z.x,z.y);
    var hw=Math.max(4,Math.abs(p[0]-c[0])), hh=Math.max(4,Math.abs(p[1]-c[1]));
    if(vert()){ z.h=round2(2*hw/ppm); z.w=round2(2*hh/ppm); } else { z.w=round2(2*hw/ppm); z.h=round2(2*hh/ppm); } }
  else if(drag.kind==="newline"){ drag.ln.b=[round2(w[0]),round2(w[1])]; }
  else if(drag.kind==="newzone"){ drag.b=w; }
  draw();
});
function endDrag(){
  if(!drag) return; var st=step(), d=drag; drag=null; cv.classList.remove("grab");
  if(d.kind==="newline"){ if(dist(d.ln.a,d.ln.b)>0.8){ snapshot(); st.lines.push(d.ln); sel={t:"line",id:d.ln.id}; inspector(); changed();
      if(d.ln.obj) toast("Line attached to "+label(objById(d.ln.obj))+" — “Next step” moves it there"); } else draw(); return; }
  if(d.kind==="newzone"){ var w=Math.abs(d.b[0]-d.a[0]), h=Math.abs(d.b[1]-d.a[1]);
    if(w>1 && h>1){ snapshot(); var z={id:uid("z"),shape:tool==="ezone"?"ellipse":"rect",x:round2((d.a[0]+d.b[0])/2),y:round2((d.a[1]+d.b[1])/2),w:round2(w),h:round2(h),color:"#ffd23f",label:""};
      st.zones.push(z); sel={t:"zone",id:z.id}; inspector(); changed(); } else draw(); return; }
  if(d.moved===false && (d.kind==="obj"||d.kind==="text"||d.kind==="zone"||d.kind==="line")){ undo.pop(); updButtons(); draw(); return; }
  changed(); inspector();
}
cv.addEventListener("pointerup", endDrag); cv.addEventListener("pointercancel", endDrag);
cv.addEventListener("dblclick", function(e){ if(!editable) return; var p=evPx(e), h=hit(p[0],p[1]);
  if(h && h.t==="text"){ var t=step().texts.filter(function(x){return x.id===h.id;})[0]; askText(p,[t.x,t.y],t); }
  else if(h && h.t==="obj"){ sel=h; inspector(); var f=document.getElementById("i_num")||document.getElementById("i_label"); if(f){ f.focus(); f.select(); } } });
function label(o){ return !o? "" : o.kind==="player"? (o.team==="away"?"opponent ":"")+"#"+o.num : o.kind; }

var txtin=document.getElementById("txtin"), txtCtx=null;
function askText(p, w, existing){
  var r=cv.getBoundingClientRect(), sr=document.getElementById("stage").getBoundingClientRect();
  txtin.style.left=(r.left-sr.left+p[0]-80)+"px"; txtin.style.top=(r.top-sr.top+p[1]-16)+"px"; txtin.style.display="block";
  txtin.value=existing?existing.text:""; txtCtx={w:w,existing:existing}; setTimeout(function(){ txtin.focus(); txtin.select(); },0);
}
txtin.addEventListener("keydown", function(e){ e.stopPropagation(); if(e.key==="Enter") commitText(); if(e.key==="Escape"){ txtin.style.display="none"; txtCtx=null; } });
txtin.addEventListener("blur", commitText);
function commitText(){ if(!txtCtx) return; var v=txtin.value.trim(), c=txtCtx; txtCtx=null; txtin.style.display="none";
  if(c.existing){ if(v && v!==c.existing.text){ snapshot(); c.existing.text=v; changed(); } return; }
  if(!v) return; snapshot(); var t={id:uid("t"),x:round2(c.w[0]),y:round2(c.w[1]),text:v,size:1.8}; step().texts.push(t); sel={t:"text",id:t.id}; inspector(); changed(); }

// ---------------------------------------------------------------- keyboard
document.addEventListener("keydown", function(e){
  var tag=(e.target&&e.target.tagName)||""; if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") return;
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey? doRedo(): doUndo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="y"){ e.preventDefault(); doRedo(); return; }
  if(e.key===" "){ e.preventDefault(); play(); return; }
  if(e.key==="Delete"||e.key==="Backspace"){ e.preventDefault(); deleteSel(); return; }
  if(e.key==="Escape"){ sel=null; setTool("select"); inspector(); draw(); return; }
  if(e.key==="ArrowRight"){ go(cur+1); return; } if(e.key==="ArrowLeft"){ go(cur-1); return; }
  if(!editable) return;
  var m={v:"select","1":"home","2":"away","3":"gkh","4":"gka",b:"ball",c:"cone",m:"mannequin",r:"run",p:"pass",s:"shot",d:"dribble",l:"line",z:"zone",e:"ezone",t:"text"}[e.key.toLowerCase()];
  if(m) setTool(m);
});

// ---------------------------------------------------------------- inspector
function pal(cols, curC, on){ return '<div class="pal">'+cols.map(function(c){ return '<button data-c="'+c+'" class="'+(c===curC?"on":"")+'" style="background:'+(c||"conic-gradient(#fff 0 25%,#ffd23f 0 50%,#ff4d4f 0 75%,#2f81f7 0)")+'" title="'+(c||"default")+'"></button>'; }).join("")+'</div>'; }
function inspector(){
  var el=document.getElementById("insp"), st=step(), html="";
  if(!sel){
    html='<h4>How to design</h4><div class="tip">'+
      '<b>1.</b> Place players, ball and equipment from the left rail.<br><b>2.</b> Draw <b>runs</b> from a player and the <b>pass</b> from the ball — they attach to it.<br>'+
      '<b>3.</b> Press <b>Next step</b>: everyone moves to the end of their line. Repeat.<br><b>4.</b> Press <b>▶</b> to watch it move along the curves.<br><br>'+
      'Select a line and drag its <span style="color:#ffd23f">yellow</span> dot to curve it. Double-click a player to rename.<br><br>'+
      '<span class="kbd">Space</span>play <span class="kbd">←</span><span class="kbd">→</span>steps <span class="kbd">Del</span>delete <span class="kbd">Ctrl Z</span>undo</div>';
    el.innerHTML=html; return;
  }
  if(sel.t==="obj"){ var o=objById(sel.id); if(!o){ sel=null; return inspector(); }
    html='<h4>'+(o.kind==="player"?(o.gk?"Goalkeeper":"Player"):o.kind)+'</h4>';
    if(o.kind==="player"||o.kind==="mark") html+='<div class="row edit"><div class="fld" style="width:64px"><span class="lbl">No.</span><input type="text" id="i_num" maxlength="4" value="'+esc(o.num)+'"/></div>'+
      '<div class="fld" style="flex:1"><span class="lbl">Label / role</span><input type="text" id="i_label" maxlength="40" value="'+esc(o.label)+'"/></div></div>';
    if(o.kind==="player") html+='<div class="row edit"><button class="ib '+(o.team==="home"?"on":"")+'" id="i_home">Ours</button><button class="ib '+(o.team==="away"?"on":"")+'" id="i_away">Opponent</button><button class="ib '+(o.gk?"on":"")+'" id="i_gk">GK</button></div>';
    html+='<div class="fld edit"><span class="lbl">Colour</span>'+pal(["","#1f6feb","#e5484d","#f5b301","#16a34a","#a855f7","#111827","#ffffff"],o.color||"")+'</div>';
    var shown=doc.steps.map(function(s,i){ return s.pos[o.id]? i+1:null; }).filter(Boolean);
    html+='<div class="tip">On the board in step'+(shown.length>1?"s ":" ")+shown.join(", ")+'.</div>';
    html+='<div class="row edit"><button class="ib" id="i_hide">Remove from this step on</button></div><div class="row edit"><button class="ib" id="i_del" style="color:#ff8a8a">Delete everywhere</button></div>';
  } else if(sel.t==="line"){ var ln=findLine(sel.id); if(!ln){ sel=null; return inspector(); }
    html='<h4>'+ln.kind+'</h4><div class="fld edit"><span class="lbl">Type</span><select id="i_kind">'+["run","pass","shot","dribble","line"].map(function(x){return '<option '+(x===ln.kind?"selected":"")+'>'+x+'</option>';}).join("")+'</select></div>'+
      '<div class="fld edit"><span class="lbl">Colour</span>'+pal(LINE_COLS,ln.color||"")+'</div>'+
      '<div class="tip">'+(ln.obj? "Attached to <b>"+label(objById(ln.obj))+"</b> — it travels along this line in the animation." : "Not attached to a player — start a line on a player or the ball to animate it.")+'</div>'+
      '<div class="row edit"><button class="ib" id="i_straight">Straighten</button><button class="ib" id="i_del" style="color:#ff8a8a">Delete</button></div>';
  } else if(sel.t==="zone"){ var z=st.zones.filter(function(x){return x.id===sel.id;})[0]; if(!z){ sel=null; return inspector(); }
    html='<h4>Zone</h4><div class="fld edit"><span class="lbl">Label</span><input type="text" id="i_zlabel" maxlength="40" value="'+esc(z.label)+'"/></div>'+
      '<div class="fld edit"><span class="lbl">Colour</span>'+pal(ZONE_COLS,z.color)+'</div><div class="row edit"><button class="ib" id="i_shape">'+(z.shape==="rect"?"Make ellipse":"Make box")+'</button><button class="ib" id="i_del" style="color:#ff8a8a">Delete</button></div>'+
      '<div class="tip">Drag the white corner handle to resize.</div>';
  } else if(sel.t==="text"){ var t=st.texts.filter(function(x){return x.id===sel.id;})[0]; if(!t){ sel=null; return inspector(); }
    html='<h4>Text</h4><div class="fld edit"><span class="lbl">Text</span><input type="text" id="i_text" maxlength="120" value="'+esc(t.text)+'"/></div>'+
      '<div class="fld edit"><span class="lbl">Size</span><input type="range" id="i_size" min="1" max="4" step="0.1" value="'+(t.size||1.8)+'"/></div><div class="row edit"><button class="ib" id="i_del" style="color:#ff8a8a">Delete</button></div>';
  }
  el.innerHTML=html; wireInspector();
}
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function wireInspector(){
  var g=function(id){ return document.getElementById(id); }, st=step();
  function bindInput(id, fn){ var e=g(id); if(!e) return; var snap=false;
    e.addEventListener("input", function(){ if(!snap){ snapshot(); snap=true; } fn(e.value); changed(); });
    e.addEventListener("change", function(){ snap=false; }); }
  if(sel.t==="obj"){ var o=objById(sel.id);
    bindInput("i_num", function(v){ o.num=v.trim(); }); bindInput("i_label", function(v){ o.label=v; });
    if(g("i_home")) g("i_home").onclick=function(){ snapshot(); o.team="home"; changed(); inspector(); };
    if(g("i_away")) g("i_away").onclick=function(){ snapshot(); o.team="away"; changed(); inspector(); };
    if(g("i_gk")) g("i_gk").onclick=function(){ snapshot(); o.gk=!o.gk; changed(); inspector(); };
    if(g("i_hide")) g("i_hide").onclick=function(){ snapshot(); for(var i=cur;i<doc.steps.length;i++){ delete doc.steps[i].pos[o.id]; doc.steps[i].lines=doc.steps[i].lines.filter(function(l){return l.obj!==o.id;}); }
      if(cur>0) doc.steps[cur-1].lines=doc.steps[cur-1].lines.filter(function(l){return l.obj!==o.id;}); sel=null; inspector(); changed(); };
    document.querySelectorAll("#insp .pal button").forEach(function(b){ b.onclick=function(){ snapshot(); o.color=b.dataset.c; changed(); inspector(); }; });
  } else if(sel.t==="line"){ var ln=findLine(sel.id);
    if(g("i_kind")) g("i_kind").onchange=function(){ snapshot(); ln.kind=g("i_kind").value; changed(); inspector(); };
    if(g("i_straight")) g("i_straight").onclick=function(){ snapshot(); ln.c=null; changed(); };
    document.querySelectorAll("#insp .pal button").forEach(function(b){ b.onclick=function(){ snapshot(); ln.color=b.dataset.c; changed(); inspector(); }; });
  } else if(sel.t==="zone"){ var z=st.zones.filter(function(x){return x.id===sel.id;})[0];
    bindInput("i_zlabel", function(v){ z.label=v; });
    if(g("i_shape")) g("i_shape").onclick=function(){ snapshot(); z.shape=z.shape==="rect"?"ellipse":"rect"; changed(); inspector(); };
    document.querySelectorAll("#insp .pal button").forEach(function(b){ b.onclick=function(){ snapshot(); z.color=b.dataset.c; changed(); inspector(); }; });
  } else if(sel.t==="text"){ var t=st.texts.filter(function(x){return x.id===sel.id;})[0];
    bindInput("i_text", function(v){ t.text=v; }); bindInput("i_size", function(v){ t.size=parseFloat(v); });
  }
  if(g("i_del")) g("i_del").onclick=deleteSel;
}

// ---------------------------------------------------------------- timeline
function go(i){ if(!doc||playing) return; if(i<0||i>=doc.steps.length) return; cur=i; sel=null; renderSteps(); inspector(); draw(); }
function renderSteps(){
  var box=document.getElementById("steps"); box.innerHTML="";
  doc.steps.forEach(function(s,i){ var b=document.createElement("div"); b.className="step"+(i===cur?" on":"")+(playing&&playing.i===i?" play":"");
    b.innerHTML='<span class="n">'+(i+1)+'</span>'+esc(s.name||("Step "+(i+1))); b.onclick=function(){ go(i); }; box.appendChild(b); });
  if(editable){
    [["+ Next step","Next step: copy this step and move everyone to the end of their line",nextStep],["Duplicate","Duplicate this step",dupStep],["Delete step","Delete this step",delStep]].forEach(function(x){
      var b=document.createElement("button"); b.className="ib"; b.textContent=x[0]; b.title=x[1]; b.onclick=x[2]; if(x[0]==="+ Next step"){ b.style.background="#1f6feb"; b.style.borderColor="#1f6feb"; b.style.color="#fff"; }
      box.appendChild(b); }); }
  var s=step(); document.getElementById("sname").value=s.name||""; document.getElementById("snote").value=s.note||"";
  document.getElementById("sdur").value=s.dur||1.6; document.getElementById("durv").textContent=(s.dur||1.6).toFixed(1)+" s";
  ["sname","snote","sdur"].forEach(function(id){ document.getElementById(id).disabled=!editable; });
}
(function(){ var snap=false;
  function bind(id, fn){ var e=document.getElementById(id); e.addEventListener("input", function(){ if(!snap){ snapshot(); snap=true; } fn(e.value); changed(); });
    e.addEventListener("change", function(){ snap=false; }); }
  bind("sname", function(v){ step().name=v; var on=document.querySelector(".step.on"); if(on) on.innerHTML='<span class="n">'+(cur+1)+'</span>'+esc(v||("Step "+(cur+1))); });
  bind("snote", function(v){ step().note=v; });
  bind("sdur", function(v){ step().dur=parseFloat(v); document.getElementById("durv").textContent=parseFloat(v).toFixed(1)+" s"; });
})();

// ---------------------------------------------------------------- top bar
function segs(){ document.querySelectorAll("#view button").forEach(function(b){ b.classList.toggle("on", b.dataset.v===doc.view); });
  document.querySelectorAll("#style button").forEach(function(b){ b.classList.toggle("on", b.dataset.v===doc.style); });
  document.getElementById("swh").style.background=doc.colors.home; document.getElementById("swa").style.background=doc.colors.away;
  document.getElementById("colh").value=doc.colors.home; document.getElementById("cola").value=doc.colors.away;
  document.getElementById("name").value=doc.name||""; document.getElementById("ghost").classList.toggle("on",ghost); document.getElementById("loop").classList.toggle("on",loop); }
document.querySelectorAll("#view button").forEach(function(b){ b.onclick=function(){ if(!editable&&false) return; snapshot(); doc.view=b.dataset.v; full(); changed(); }; });
document.querySelectorAll("#style button").forEach(function(b){ b.onclick=function(){ snapshot(); doc.style=b.dataset.v; segs(); changed(); }; });
document.getElementById("colh").addEventListener("input", function(e){ doc.colors.home=e.target.value; segs(); changed(); });
document.getElementById("cola").addEventListener("input", function(e){ doc.colors.away=e.target.value; segs(); changed(); });
document.getElementById("name").addEventListener("input", function(e){ doc.name=e.target.value; changed(); });
document.getElementById("mirror").onclick=mirror;
document.getElementById("ghost").onclick=function(){ ghost=!ghost; segs(); draw(); };
document.getElementById("loop").onclick=function(){ loop=!loop; segs(); };
document.getElementById("undo").onclick=doUndo; document.getElementById("redo").onclick=doRedo;
document.getElementById("play").onclick=play;
function updButtons(){ document.getElementById("undo").disabled=!undo.length; document.getElementById("redo").disabled=!redo.length; }

function full(){ layout(); segs(); renderSteps(); inspector(); updButtons(); draw(); setHeight(); }
window.addEventListener("resize", function(){ if(doc){ layout(); draw(); setHeight(); } });

// ---------------------------------------------------------------- render from Python
window.addEventListener("message", function(ev){
  var d=ev.data; if(!d || d.type!=="streamlit:render") return; var a=d.args||{};
  editable=!!a.editable; document.getElementById("app").classList.toggle("ro", !editable);
  if(a.load_nonce!==lastNonce){ lastNonce=a.load_nonce; doc=a.doc; cur=Math.min(a.cur||0, doc.steps.length-1); sel=null; undo=[]; redo=[]; stop(); buildRail(); full(); }
});
playBtn();
send("streamlit:componentReady",{apiVersion:1});
})();
</script>
